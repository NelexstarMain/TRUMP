<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Nuty na trąbce</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat+Brush&display=swap">
<style>
/* Layout: one wall of five pasted posters. The camera slides between them, hub in the middle.
   Three spot inks on cool newsprint; every dark tone is an overprint of two inks. */
:root{
  color-scheme:light;
  --paper:#E7E9E2;
  --white:#FAFAF5;
  --pink:#FF4FA8;
  --blue:#1466C8;
  --yellow:#FFDF1C;
  --ink:#142084;      /* pink over blue */
  --red:#FF4512;      /* pink over yellow */
  --display:"Dela Gothic One","Arial Black","Segoe UI Black",Impact,sans-serif;
  --text:"Bricolage Grotesque","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --marker:"Caveat Brush","Comic Sans MS","Segoe Print",cursive;
  --tab:clamp(46px,11vmin,84px);
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.35;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
p{margin:0}
sup{font-size:.55em;vertical-align:.62em;line-height:0;margin-left:.04em}

#stage{position:relative;height:100%;overflow:hidden;touch-action:none;isolation:isolate;--mx:2.2;--my:1.4;cursor:grab}
#stage.dragging{cursor:grabbing}
#wall{position:absolute;inset:0;will-change:transform}

/* ---------- plates: each ink is its own layer, slightly out of register ---------- */
.pl{mix-blend-mode:multiply}
.pl-p{transform:translate(calc(var(--mx)*1px),calc(var(--my)*1px))}
.pl-b{transform:translate(calc(var(--mx)*-1px),calc(var(--my)*-1px))}
.pl-y{transform:translate(calc(var(--my)*1px),calc(var(--mx)*-.7px))}
.reg{text-shadow:calc(var(--mx)*1.2px) calc(var(--my)*1.2px) 0 var(--pink)}
.reg-y{text-shadow:calc(var(--mx)*1.2px) calc(var(--my)*1.2px) 0 var(--yellow)}

#grain{position:absolute;inset:0;pointer-events:none;z-index:60;background-image:var(--noise);background-size:256px 256px}

/* ---------- rooms ---------- */
.room{position:absolute;width:100%;height:100%;box-sizing:border-box;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,24px);
  padding-block:clamp(52px,9vh,84px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.room>*{position:relative;z-index:1}
.room::before,.room::after{content:"";position:absolute;pointer-events:none;z-index:0}
.title{position:absolute;top:clamp(12px,2.6vh,26px);left:max(18px,env(safe-area-inset-left,0px));
  font-family:var(--display);font-size:clamp(22px,5.4vmin,40px);line-height:1;letter-spacing:-.01em}

/* small pull tabs sitting on the edge the gesture pulls from */
.tab{position:absolute;z-index:3;font-family:var(--marker);font-size:clamp(17px,2.6vmin,21px);line-height:1;
  background:var(--white);color:var(--ink);display:grid;place-items:center;white-space:nowrap}
.tab.t-left,.tab.t-right{top:50%;width:34px;height:120px;margin-top:-60px}
.tab.t-left{left:0}.tab.t-right{right:0}
.tab.t-left span,.tab.t-right span{writing-mode:vertical-rl}
.tab.t-left span{transform:rotate(180deg)}
.tab.t-top,.tab.t-bottom{left:50%;width:132px;margin-left:-66px;height:32px}
.tab.t-top{top:0}.tab.t-bottom{bottom:0}
.tab.dark{background:var(--ink);color:var(--paper)}
.tab.sun{background:var(--yellow)}

/* ---------- note card ---------- */
.card{position:relative;background:var(--white);width:min(100%,clamp(240px,62vh,520px));aspect-ratio:320/250;
  box-shadow:7px 8px 0 var(--ink);transform:rotate(-1.2deg)}
.card.small{width:min(100%,clamp(200px,38vh,340px))}
.card::before{content:"";position:absolute;left:50%;top:-13px;width:92px;height:26px;margin-left:-46px;
  background:var(--yellow);transform:rotate(2.5deg);opacity:.92}
.crop{position:absolute;width:14px;height:14px;border:0 solid var(--ink);pointer-events:none}
.crop.c1{left:-22px;top:-22px;border-right-width:1.5px;border-bottom-width:1.5px}
.crop.c2{right:-22px;top:-22px;border-left-width:1.5px;border-bottom-width:1.5px}
.crop.c3{left:-22px;bottom:-22px;border-right-width:1.5px;border-top-width:1.5px}
.crop.c4{right:-22px;bottom:-22px;border-left-width:1.5px;border-top-width:1.5px}
.staff{display:block;width:100%;height:100%;overflow:visible}
.staff .lines line,.staff .led{stroke:var(--ink);stroke-width:2.2}
.staff .clef{fill:none;stroke:var(--ink);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.staff .clef-dot{fill:var(--ink)}
.tgt .head{fill:var(--pink)}.tgt .stem{stroke:var(--pink);stroke-width:4;stroke-linecap:round}
.tgt .acc{stroke:var(--pink);fill:none;stroke-linecap:round}
.tgt.solid .head{fill:var(--ink)}.tgt.solid .stem,.tgt.solid .acc{stroke:var(--ink)}
.gho{opacity:0;transition:opacity .12s;transform:translate(calc(var(--mx)*-1px),calc(var(--gy,0)*1px - var(--my)*1px))}
.gho .head{fill:var(--blue)}.gho .stem{stroke:var(--blue);stroke-width:4;stroke-linecap:round}
.gho .acc{stroke:var(--blue);fill:none;stroke-linecap:round}.gho .led{stroke:var(--blue)}
.ring-good{fill:none;stroke:var(--yellow);stroke-width:13;stroke-linecap:butt;transform-box:fill-box;transform-origin:center;transform:rotate(-90deg)}
.ring-time{fill:none;stroke:var(--ink);stroke-width:3;opacity:0;transition:opacity .15s;transform-box:fill-box;transform-origin:center;transform:rotate(-90deg)}
.ring-time.on{opacity:.75}
.stamp{position:absolute;right:-14px;top:-18px;width:clamp(84px,24%,128px);aspect-ratio:1;border-radius:50%;
  background:var(--yellow);color:var(--ink);display:grid;place-content:center;text-align:center;
  box-shadow:0 0 0 5px var(--white),4px 5px 0 5px var(--ink);transform:rotate(12deg) scale(0);pointer-events:none}
.stamp b{font-family:var(--display);font-weight:400;font-size:clamp(24px,6vmin,40px);line-height:1}
.stamp i{font-family:var(--marker);font-style:normal;font-size:clamp(15px,2.6vmin,20px);line-height:1}
.stamp.on{animation:slap .42s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes slap{0%{transform:rotate(-24deg) scale(2.4);opacity:0}55%{opacity:1}100%{transform:rotate(12deg) scale(1);opacity:1}}

.says{font-family:var(--marker);font-size:clamp(20px,3.6vmin,28px);line-height:1.1;text-align:center;min-height:1.2em;max-width:26ch;text-wrap:balance}
.says.label{background:var(--white);color:var(--ink);padding:6px 14px 8px;box-shadow:3px 4px 0 var(--ink);transform:rotate(-1.5deg)}
.says.label:empty{visibility:hidden}

/* valves, seen from above */
.valves{display:flex;gap:clamp(10px,3vmin,20px);align-items:center;justify-content:center}
.v{width:clamp(44px,11vmin,64px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;box-sizing:border-box;
  border:4px solid var(--ink);background:var(--white);color:var(--ink);font-family:var(--display);font-size:clamp(18px,4.4vmin,26px);
  box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .08s}
.v.on{background:var(--ink);color:var(--yellow);transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.v.want{outline:4px dashed var(--pink);outline-offset:4px}

/* ---------- hub: the pigeon plays this very game on a retro computer; no words here ---------- */
.hub{background:var(--paper);padding:calc(var(--tab) + 6px)}
.hub::before{width:min(56vmin,380px);aspect-ratio:1;border-radius:50%;left:50%;top:38%;translate:-10% -70%;background:var(--yellow)}
.hub::after{width:520px;height:520px;left:50%;top:40%;translate:-50% -50%;background:var(--ht-rad-pink) center/520px no-repeat;mix-blend-mode:multiply}
.perch{position:absolute;width:1px;height:1px}
.scene{font-size:clamp(5.5px,min(1.9vw,1.55vh),11.5px);width:46em;height:46em;perspective:110em;perspective-origin:calc(50% + var(--ptx,0)*-22%) calc(26% + var(--pty,0)*-14%)}
.scene>*,.world>*{position:absolute}
.world{left:calc(50% - 5em);top:58%;width:0;height:0;transform-style:preserve-3d;--yaw:18deg;--pitch:16deg;
  transform:rotateX(calc(var(--pitch)*-1)) rotateY(var(--yaw));animation:wsway 11s ease-in-out infinite alternate}
@keyframes wsway{to{transform:rotateX(calc(var(--pitch)*-.9)) rotateY(calc(var(--yaw)*.62))}}
/* the floor is a real plane at y=0; everything else stands on it */
.floor{left:-75em;top:-45em;width:150em;height:110em;transform:rotateX(90deg);background:var(--yellow);
  -webkit-mask-image:linear-gradient(to top,#000 82%,transparent 99%);mask-image:linear-gradient(to top,#000 82%,transparent 99%);
  background-image:repeating-linear-gradient(90deg,var(--ink) 0 .3em,transparent .3em 5em),repeating-linear-gradient(0deg,var(--ink) 0 .3em,transparent .3em 5em)}
.sh{left:calc(var(--w)*-.5em);top:calc(var(--d)*-.5em);width:calc(var(--w)*1em);height:calc(var(--d)*1em);background:var(--ink);opacity:.2;border-radius:1.5em;
  transform:translate3d(calc(var(--x)*1em),-.2em,calc(var(--z)*1em)) rotateX(90deg)}
.sh.o{border-radius:50%}
/* boxes: centre at (x,y,z) in em, y up is negative; faces are real planes */
.bx,.grp{left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.bx{transform:translate3d(calc(var(--x)*1em),calc(var(--y)*1em),calc(var(--z)*1em))}
.grp{transform:translate3d(calc(var(--x)*1em),0,calc(var(--z)*1em)) rotateY(calc(var(--ry,0)*1deg))}
.bx>.fc{position:absolute;box-sizing:border-box;border:calc(var(--bd,.42)*1em) solid var(--ink)}
.bx>.fr,.bx>.bk{width:calc(var(--w)*1em);height:calc(var(--h)*1em);left:calc(var(--w)*-.5em);top:calc(var(--h)*-.5em);background-color:var(--cf,var(--white))}
.bx>.lf,.bx>.rt{width:calc(var(--d)*1em);height:calc(var(--h)*1em);left:calc(var(--d)*-.5em);top:calc(var(--h)*-.5em);background-color:var(--cs,var(--blue))}
.bx>.tp,.bx>.bt{width:calc(var(--w)*1em);height:calc(var(--d)*1em);left:calc(var(--w)*-.5em);top:calc(var(--d)*-.5em);background-color:var(--ct,var(--pink))}
.bx>.fr{transform:translateZ(calc(var(--d)*.5em))}.bx>.bk{transform:rotateY(180deg) translateZ(calc(var(--d)*.5em))}
.bx>.lf{transform:rotateY(-90deg) translateZ(calc(var(--w)*.5em))}.bx>.rt{transform:rotateY(90deg) translateZ(calc(var(--w)*.5em))}
.bx>.tp{transform:rotateX(90deg) translateZ(calc(var(--h)*.5em))}.bx>.bt{transform:rotateX(-90deg) translateZ(calc(var(--h)*.5em))}
.mon>.fr{border-radius:1.5em}
.kr{--bd:.2}
.kr>.fr,.kr>.tp{background-image:repeating-linear-gradient(90deg,var(--ink) 0 .22em,transparent .22em 1.9em)}
.sp>.fr,.sp>.tp{background-image:none}
.dome>.tp{border-radius:1.9em 1.9em 1.5em 1.5em}
.dome>.tp::before{content:"";position:absolute;left:50%;top:0;bottom:56%;border-left:.3em solid var(--ink)}
.dome>.tp::after{content:"";position:absolute;left:0;right:0;top:44%;border-top:.3em solid var(--ink)}
.cable{left:-4em;top:-5.5em;width:8em;height:11em;overflow:visible;fill:none;stroke:var(--ink);stroke-width:.4;stroke-linecap:round;
  transform:translate3d(calc(var(--x)*1em),-.7em,calc(var(--z)*1em)) rotateX(90deg)}
/* the pigeon is a flat sprite standing on the floor, turned back toward the camera */
.ty3{left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform:translate3d(calc(var(--x)*1em),0,calc(var(--z)*1em)) rotateY(calc(var(--yaw)*-1)) rotateX(var(--pitch))}
.slot{position:absolute;left:3em;top:1.4em;width:9em;height:.9em;background:var(--ink)}
.led{position:absolute;right:2.2em;bottom:1em;width:1em;height:1em;border-radius:50%;background:var(--pink);animation:led 1.1s steps(2) infinite}
@keyframes led{50%{background:var(--yellow)}}
.knob{position:absolute;left:2.2em;bottom:.8em;width:4em;height:1.2em;background:repeating-linear-gradient(90deg,var(--ink) 0 .35em,transparent .35em .8em)}
.crt{position:absolute;inset:1.3em 1.3em 3.3em;background:var(--ink);border-radius:1.3em;overflow:hidden}
.crt::after{content:"";position:absolute;inset:-.5em 0 0;will-change:transform;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(250,250,245,.14) 0 .16em,transparent .16em .5em);animation:scan 1s linear infinite}
@keyframes scan{to{transform:translateY(.5em)}}
@keyframes flick{0%,100%{filter:none}47%{filter:brightness(1.3)}49%{filter:none}}
.mg{position:absolute;inset:0;display:grid;grid-template:1fr 1fr/1fr 1fr;gap:.9em;padding:1.2em}
.mt{position:relative;background:var(--c);color:var(--k,var(--ink));border-radius:.5em;display:grid;place-items:center;transition:transform .12s}
.mt svg{width:55%;height:55%}
.mt.hit{transform:scale(.84)}
.mt.open{position:absolute;inset:.6em;z-index:2;animation:mopen .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes mopen{from{transform:scale(.35)}}
.mt.open svg{animation:mtry .45s ease-in-out infinite alternate}
@keyframes mtry{from{transform:rotate(-10deg) scale(.88)}to{transform:rotate(10deg) scale(1.12)}}
.cur{position:absolute;z-index:3;left:50%;top:50%;width:2.4em;height:2.4em;background:var(--white);clip-path:polygon(0 0,100% 62%,56% 68%,78% 100%,58% 100%,40% 74%,10% 100%);
  transition:left .7s cubic-bezier(.4,1.4,.5,1),top .7s cubic-bezier(.4,1.4,.5,1);pointer-events:none}
.res{position:absolute;z-index:4;inset:0;display:none;pointer-events:none}
.mg.fail .res,.mg.win .res{display:block}
.mg.fail .res{background:linear-gradient(45deg,transparent 44%,var(--pink) 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--pink) 44% 56%,transparent 56%)}
.mg.win .res{background:radial-gradient(circle,transparent 30%,var(--yellow) 31% 46%,transparent 47%);animation:mopen .3s}
.mg.fail{animation:mshake .4s linear}
@keyframes mshake{20%{transform:translateX(-.9em)}40%{transform:translateX(.8em)}60%{transform:translateX(-.5em)}80%{transform:translateX(.3em)}}
/* the pigeon at the keyboard, seen from behind, facing the monitor */
.typist{position:absolute;left:-6em;bottom:0;width:12em;height:auto;overflow:visible;opacity:0;transform:scale(.5);transform-origin:50% 100%;transition:opacity .15s,transform .25s cubic-bezier(.2,1.5,.4,1);cursor:pointer}
.hub.home .typist{opacity:1;transform:none}
.tw{transform-box:fill-box}
.tw-l{transform-origin:100% 100%;animation:typeL .2s ease-in-out infinite alternate}
.tw-r{transform-origin:0 100%;animation:typeR .2s ease-in-out infinite alternate-reverse}
@keyframes typeL{to{transform:rotate(-14deg) translateY(-3px)}}
@keyframes typeR{to{transform:rotate(14deg) translateY(-3px)}}
.ty-hd{transform-box:fill-box;transform-origin:50% 100%;animation:tyhd 2.4s ease-in-out infinite}
@keyframes tyhd{0%,100%{transform:rotate(-4deg)}40%{transform:rotate(5deg) translateY(2px)}62%{transform:rotate(2deg) translateY(5px)}}
.ty-all{transform-box:fill-box;transform-origin:50% 100%}
.typist[data-s="hit"] .tw{animation:none;transform:translateY(6px) scaleY(.88)}
.typist[data-s="bad"] .ty-hd{animation:tyno .2s linear infinite}
@keyframes tyno{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.typist[data-s="bad"] .tw{animation:none;transform:translateY(13px)}
.typist[data-s="bad"] .ty-all{animation:ruffle .45s linear 1}
.typist[data-s="win"] .ty-all{animation:jump .8s ease-out 1}
.typist[data-s="win"] .tw-l{animation:none;transform:rotate(-40deg) translateY(-12px)}
.typist[data-s="win"] .tw-r{animation:none;transform:rotate(40deg) translateY(-12px)}
.hub .perch{left:25.7em;top:44em}
.edge{position:absolute;z-index:2;display:grid;place-items:center;color:var(--ink)}
.edge svg{width:calc(var(--tab)*.5);height:calc(var(--tab)*.5);animation:nudge 6.4s ease-in-out infinite}
.e-right{right:0;top:0;bottom:0;width:var(--tab);background:var(--pink)}
.e-left{left:0;top:0;bottom:0;width:var(--tab);background:var(--yellow)}
.e-up{top:0;left:0;right:0;height:var(--tab);background:var(--blue);color:var(--white)}
.e-down{bottom:0;left:0;right:0;height:var(--tab);background:var(--ink);color:var(--white);mix-blend-mode:normal}
.e-right svg{--nx:-9px}.e-left svg{--nx:9px;animation-delay:1.6s}.e-up svg{--ny:8px;animation-delay:3.2s}.e-down svg{--ny:-8px;animation-delay:4.8s}
.ic{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}

/* ---------- nuty ---------- */
.nuty{background:var(--pink);padding-left:max(46px,env(safe-area-inset-left,0px));padding-right:max(46px,env(safe-area-inset-right,0px))}
.nuty::before{width:74vmin;aspect-ratio:1;border-radius:50%;left:-20vmin;top:-16vmin;background:var(--red)}
.nuty::after{left:0;right:0;bottom:0;height:440px;background:var(--ht-fade-blue) center bottom/440px repeat-x}
.bars{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:min(100%,520px);min-height:16px}
.bars i{width:16px;height:16px;box-sizing:border-box;border:2px solid var(--ink)}
.bars i.d{background:var(--ink)}.bars i.d:nth-child(3n+1){background:var(--yellow)}.bars i.d:nth-child(3n+2){background:var(--white)}
.bars i.now{background:var(--blue)}
.deck{position:relative;width:min(100%,clamp(240px,62vh,520px));display:grid}
.deck>*{grid-area:1/1}
.sheet{background:var(--white);box-shadow:5px 6px 0 var(--ink);opacity:.9}
.sheet.s2{transform:rotate(2.4deg) translate(6px,5px)}.sheet.s3{transform:rotate(-3.6deg) translate(-7px,8px)}
.deck .card{width:100%}
.hint{position:absolute;z-index:4;left:0;right:0;bottom:0;background:var(--yellow);color:var(--ink);
  padding:44px max(20px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;gap:clamp(16px,5vmin,36px);align-items:center;justify-content:center;flex-wrap:wrap;
  transform:translateY(calc((100% - 36px)*(1 - var(--p,0))));transition:transform .34s cubic-bezier(.2,1.2,.3,1)}
.hint.live{transition:none}
.hint-grip{position:absolute;top:8px;left:0;right:0;text-align:center;font-family:var(--marker);font-size:clamp(17px,2.6vmin,21px);line-height:1}
.hint-name{font-family:var(--display);font-size:clamp(40px,11vmin,72px);line-height:.9}
.hint-how{font-weight:600;font-size:clamp(15px,2.4vmin,18px)}
.done{display:grid;gap:10px;justify-items:center;text-align:center;background:var(--white);box-shadow:7px 8px 0 var(--ink);
  padding:clamp(22px,5vmin,40px);transform:rotate(1.4deg);max-width:min(100%,460px);box-sizing:border-box}
.done h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(30px,8vmin,56px);line-height:.98;text-wrap:balance}
.done p{font-size:clamp(15px,2.4vmin,18px);font-weight:500;max-width:30ch}

/* ---------- palce ---------- */
.palce{background:var(--yellow);padding-right:max(46px,env(safe-area-inset-right,0px))}
.palce::before{width:160%;height:34%;left:-30%;top:52%;background:var(--red);transform:rotate(-14deg)}
.palce::after{width:520px;height:520px;right:-190px;top:-200px;background:var(--ht-rad-blue) center/520px no-repeat}
.big-name{font-family:var(--display);font-size:clamp(40px,10vmin,76px);line-height:.9}
.horn{display:flex;align-items:center;gap:clamp(12px,4vmin,26px);flex-wrap:wrap;justify-content:center}
.blow{height:clamp(56px,14vmin,80px);padding:0 clamp(18px,5vmin,30px);border-radius:999px 14px 14px 999px;background:var(--ink);color:var(--yellow);
  font-family:var(--display);font-size:clamp(17px,4vmin,24px);box-shadow:0 6px 0 var(--blue);transition:transform .08s,box-shadow .08s}
.blow:active,.blow.on{transform:translateY(5px);box-shadow:0 1px 0 var(--blue)}
.score{font-family:var(--marker);font-size:clamp(19px,3vmin,24px);line-height:1.1;text-align:center}

/* ---------- strój ---------- */
.stroj{background:var(--blue);color:var(--white)}
.stroj::before{width:82vmin;aspect-ratio:1;border-radius:50%;left:-30vmin;bottom:-34vmin;background:var(--yellow)}

@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-26px) rotate(-8deg)}60%{transform:translateY(0) rotate(0)}78%{transform:translateY(-10px)}}

#bird[data-mood="idle"] .b-head{animation:bob 2.6s steps(1) infinite}

#bird[data-mood="hear"] .b-head{animation:bob .5s steps(1) infinite}

#bird[data-mood="good"] .b-all{animation:pant .6s ease-in-out infinite}
#bird[data-mood="win"] .b-all{animation:jump .8s ease-out 1}

#bird[data-mood="fly"] .b-legs{transform:translateY(-9px) scaleY(.45)}

#bird[data-mood="bad"] .b-head{transform:rotate(16deg)}

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const DAY=864e5,GAP=56;
const INK={p:'#FF4FA8',b:'#1466C8',y:'#FFDF1C',w:'#FAFAF5',i:'#142084'};

/* ================= music ================= */
// order in which written notes are introduced, and standard B-trumpet fingerings from written fis (54) to c3 (84)
const ORDER=[60,62,64,65,67,69,71,72,59,57,70,66,55,74,63,76,61,77,58,68,79,54,56,73,75,78,81,80,82,83,84];
const FING='123,13,23,12,1,2,0,123,13,23,12,1,2,0,23,12,1,2,0,12,1,2,0,1,2,0,23,12,1,2,0'.split(',');
const fing=m=>FING[m-54];
const NAT={0:0,2:1,4:2,5:3,7:4,9:5,11:6};
const BLK={1:[[0,1],[1,-1]],3:[[2,-1],[1,1]],6:[[3,1],[4,-1]],8:[[4,1],[5,-1]],10:[[6,-1],[5,1]]};
function spell(m,alt){const pc=((m%12)+12)%12,oct=Math.floor(m/12)-1;
  if(pc in NAT)return{m,L:NAT[pc],acc:0,oct};const[L,acc]=BLK[pc][alt?1:0];return{m,L,acc,oct}}
const LET=['c','d','e','f','g','a','h'];
function base(sp){let n=LET[sp.L];if(sp.acc===1)n+='is';else if(sp.acc===-1)n=n==='e'?'es':n==='a'?'as':n==='h'?'b':n+'es';return n}
const octN=sp=>sp.oct>=4?sp.oct-3:0;
const nameHTML=sp=>base(sp)+(octN(sp)?`<sup>${octN(sp)}</sup>`:'');
const nameTxt=nameHTML;
const hz=m=>store.set.a4*Math.pow(2,(m-store.set.tr-69)/12);
function howTxt(f){return f==='0'?'bez wentyli':'wciśnij '+f.split('').join(' i ')}
function valvesHTML(f){return [1,2,3].map(n=>`<span class="v${f&&f.includes(n)?' on':''}">${n}</span>`).join('')}

const CLEF='M51 166C44 166 41 158 46 152C52 146 64 150 65 162C66 174 56 182 46 180C34 178 27 166 29 152C31 136 44 124 53 110C62 96 66 80 62 66C59 54 50 54 48 66C46 80 50 100 53 120C57 150 61 180 62 200C63 214 54 222 46 216';
function staffHTML(rings){return `<svg class="staff" viewBox="0 26 320 250" aria-hidden="true">
<g class="lines">${[100,120,140,160,180].map(y=>`<line x1="12" x2="308" y1="${y}" y2="${y}"/>`).join('')}</g>
<path class="clef" d="${CLEF}"/><circle class="clef-dot" cx="46" cy="212" r="6"/>
${rings?'<circle class="ring-good pl pl-y" cx="200" cy="140" r="34"/><circle class="ring-time" cx="200" cy="140" r="45"/>':''}
<g class="tgt pl pl-p"></g><g class="gho pl"></g></svg>`}
function noteHTML(sp,x){const step=sp.oct*7+sp.L-30,y=180-step*10;let s='';
  for(let l=-2;l>=step;l-=2)s+=`<line class="led" x1="${x-23}" x2="${x+23}" y1="${180-l*10}" y2="${180-l*10}"/>`;
  for(let l=10;l<=step;l+=2)s+=`<line class="led" x1="${x-23}" x2="${x+23}" y1="${180-l*10}" y2="${180-l*10}"/>`;
  s+=`<ellipse class="head" cx="${x}" cy="${y}" rx="13.5" ry="9.6" transform="rotate(-22 ${x} ${y})"/>`;
  s+=step<4?`<line class="stem" x1="${x+12}" y1="${y-3}" x2="${x+12}" y2="${y-66}"/>`:`<line class="stem" x1="${x-12}" y1="${y+3}" x2="${x-12}" y2="${y+66}"/>`;
  const ax=x-36;
  if(sp.acc===1)s+=`<path class="acc" stroke-width="2.6" d="M${ax-4} ${y-17}V${y+19}M${ax+5} ${y-19}V${y+17}"/><path class="acc" stroke-width="5.4" d="M${ax-11} ${y-3}L${ax+12} ${y-9}M${ax-11} ${y+9}L${ax+12} ${y+3}"/>`;
  if(sp.acc===-1)s+=`<path class="acc" stroke-width="3.4" d="M${ax-5} ${y-28}V${y+9}C${ax+16} ${y+1} ${ax+12} ${y-13} ${ax-5} ${y-5}"/>`;
  return{html:s,y}}

/* ================= storage ================= */
const KEY='trabka.v1';
const store=(()=>{const d={set:{tr:2,a4:440,snd:1},cards:{},nd:{d:'',n:0},last:'',streak:0,best:{},fb:0};
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cards)return Object.assign(d,s,{set:Object.assign(d.set,s.set)})}catch(e){}return d})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const dayKey=(t=Date.now())=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const dayStart=()=>new Date().setHours(0,0,0,0);
function markToday(){const k=dayKey();if(store.last!==k){store.streak=store.last===dayKey(Date.now()-DAY)?store.streak+1:1;store.last=k}save()}
const pl=(n,one,few,many)=>n===1?one:(n%10>=2&&n%10<=4&&(n%100<12||n%100>14))?few:many;

/* ================= spaced repetition =================
   grade 0 = nie wiem, 1 = z podpowiedzią albo po pomyłce, 2 = dobrze, 3 = szybko i czysto.
   New and failed notes come back within the session; a note leaves the session after two clean plays,
   then returns after 1 day, then intervals grow by its ease factor. */
function grade(m,g,q){
  let c=store.cards[m];
  if(!c){c=store.cards[m]={r:0,i:0,e:2.3,d:0,l:0,s:0};if(store.nd.d!==dayKey())store.nd={d:dayKey(),n:0};store.nd.n++}
  c.r++;
  const back=p=>q.splice(Math.min(p,q.length),0,m);
  if(g===0){c.l++;c.s=0;c.i=0;c.e=Math.max(1.3,c.e-.2);back(2)}
  else if(c.i===0){
    if(g===1)back(3);
    else{c.s++;if(c.s>=2)c.i=g===3?2:1;else back(4)}
  }else if(g===1){c.i=Math.max(1,Math.round(c.i*1.2));c.e=Math.max(1.3,c.e-.15)}
  else if(g===2){c.i=Math.max(c.i+1,Math.round(c.i*c.e))}
  else{c.i=Math.max(c.i+2,Math.round(c.i*c.e*1.3));c.e=Math.min(3,c.e+.1)}
  c.d=c.i>0?dayStart()+c.i*DAY:Date.now();
  save();
}
function plan(){
  const now=Date.now(),due=[],learn=[];
  for(const m of ORDER){const c=store.cards[m];if(!c)continue;if(c.i===0)learn.push(m);else if(c.d<=now)due.push(m)}
  due.sort((a,b)=>store.cards[a].d-store.cards[b].d);
  const used=store.nd.d===dayKey()?store.nd.n:0;
  const allow=Math.max(0,3-used-Math.max(0,learn.length-2));
  const fresh=ORDER.filter(m=>!store.cards[m]).slice(0,allow);
  return{due,learn,fresh};
}

/* ================= sound: everything is synthesised here, no samples ================= */
const MOT={'0,0':[523.25,659.25],'1,0':[659.25,783.99],'-1,0':[587.33,440],'0,-1':[783.99,880],'0,1':[261.63,392]}; // two-note landing motif per room
const snd={ctx:null,nb:null,sl:null,slOn:0,
  ensure(){try{if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;this.ctx=new A()}
    if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx}catch(e){return null}},
  fx(){return store.set.snd?this.ensure():null},
  noiseBuf(){const c=this.ctx;if(!this.nb){const n=c.sampleRate*2;this.nb=c.createBuffer(1,n,c.sampleRate);const d=this.nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}return this.nb},
  osc(type,f0,f1,at,dur,vol){const c=this.ctx,t=c.currentTime+at,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.012,dur*.25));g.gain.exponentialRampToValueAtTime(.0004,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.03)},
  noise(type,f0,f1,at,dur,vol,q){const c=this.ctx,t=c.currentTime+at,s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();s.buffer=this.noiseBuf();s.loop=true;
    bp.type=type;bp.Q.value=q||.8;bp.frequency.setValueAtTime(f0,t);if(f1)bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*.3);g.gain.exponentialRampToValueAtTime(.0004,t+dur);s.connect(bp);bp.connect(g);g.connect(c.destination);s.start(t,Math.random()*1.5);s.stop(t+dur+.03)},
  brass(f,at,dur,vol,bend){const c=this.ctx,t=c.currentTime+at,g=c.createGain(),lp=c.createBiquadFilter();
    lp.type='lowpass';lp.Q.value=1.4;lp.frequency.setValueAtTime(f*1.4,t);lp.frequency.exponentialRampToValueAtTime(Math.min(9000,f*6),t+Math.min(.08,dur*.4));lp.frequency.exponentialRampToValueAtTime(f*(bend?1.15:3),t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.03);g.gain.setValueAtTime(vol,t+Math.max(.04,dur-.1));g.gain.linearRampToValueAtTime(0,t+dur);
    for(const d of[-5,5]){const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f,t);if(bend)o.frequency.exponentialRampToValueAtTime(f*bend,t+dur);o.detune.value=d;o.connect(lp);o.start(t);o.stop(t+dur+.05)}
    lp.connect(g);g.connect(c.destination)},
  tone(f,dur=1.1,vol=.15){if(!this.ensure())return;this.brass(f,0,dur,vol);ear.mute(dur*1000+260)},
  fanfare(f){if(!this.fx())return;this.brass(f,0,.1,.1);this.brass(f*1.26,.1,.1,.1);this.brass(f*1.498,.2,.36,.12);this.osc('sine',f*4,0,.2,.3,.03);ear.mute(860)},
  wah(f){if(!this.fx())return;this.brass(f,0,.2,.1,.97);this.brass(f*.94,.22,.4,.1,.9);ear.mute(880)},
  ok(){if(!this.fx())return;this.osc('triangle',784,0,0,.14,.12);this.osc('triangle',1175,0,.09,.24,.12);ear.mute(420)},
  bad(){this.wah(175)},
  valve(down){if(!this.fx())return;this.osc('square',down?1500:2000,0,0,.014,.03);this.osc('sine',down?230:280,down?120:210,0,.06,.13);ear.mute(140)},
  peel(fwd){if(!this.fx())return;this.noise('bandpass',fwd?500:2800,fwd?3000:600,0,.16,.09,1.6);ear.mute(300)},
  pluck(f,at){this.osc('triangle',f,0,at,.32,.085);this.osc('sine',f*2,0,at,.16,.03)},
  land(k){if(!this.fx())return;this.osc('sine',150,48,0,.17,.3);this.noise('highpass',2400,0,0,.04,.07);const m=MOT[k]||MOT['0,0'];this.pluck(m[0],.03);this.pluck(m[1],.12);ear.mute(520)},
  bump(){if(!this.fx())return;this.osc('sine',110,62,0,.12,.25);this.noise('lowpass',500,0,0,.06,.08);ear.mute(240)},

// buf: 2048 samples. Halved to 1024 for speed, then the normalised square difference function picks the period.
function detect(buf,sr,x,nsdf){
  const n=1024;let e=0;
  for(let i=0;i<n;i++){const v=(buf[2*i]+buf[2*i+1])*.5;x[i]=v;e+=v*v}
  const rms=Math.sqrt(e/n);if(rms<.006)return null;
  const s2=sr/2,maxTau=Math.min(nsdf.length-2,Math.ceil(s2/120));
  for(let t=0;t<=maxTau+1;t++){let a=0,m=0;for(let i=0,k=n-t;i<k;i++){const p=x[i],q=x[i+t];a+=p*q;m+=p*p+q*q}nsdf[t]=m>0?2*a/m:0}
  let t=1;while(t<maxTau&&nsdf[t]>0)t++;
  const peaks=[];let hi=0,bp=-1,bv=0;
  for(;t<=maxTau;t++){
    if(nsdf[t]>0){if(nsdf[t]>bv&&nsdf[t]>=nsdf[t-1]&&nsdf[t]>=nsdf[t+1]){bv=nsdf[t];bp=t}}
    else if(bp>0){peaks.push(bp);if(bv>hi)hi=bv;bp=-1;bv=0}
  }
  if(bp>0){peaks.push(bp);if(bv>hi)hi=bv}
  if(hi<.82)return null;
  let tau=0;for(const p of peaks)if(nsdf[p]>=hi*.9){tau=p;break}
  if(!tau)return null;
  const a=nsdf[tau-1],b=nsdf[tau],c=nsdf[tau+1],den=a-2*b+c,sh=den?clamp(.5*(a-c)/den,-1,1):0;
  const f=s2/(tau+sh);
  return f>130&&f<1300?{f,rms,clarity:hi}:null;
}

    x.strokeStyle='rgba(20,32,132,.55)';x.lineWidth=1.5;x.setLineDash([2,7]);x.beginPath();x.moveTo(0,mid);x.lineTo(w,mid);x.stroke();x.setLineDash([]);

    for(const[col,dx,dy]of[['#FF4FA8',3,3],['#FAFAF5',0,0]]){x.strokeStyle=col;x.lineWidth=4;x.lineJoin=x.lineCap='round';x.beginPath();
      for(let i=0;i<p.length;i+=2){const px=p[i]*pps-off+dx,py=mid-clamp(p[i+1],-50,50)*sc+dy;if(i)x.lineTo(px,py);else x.moveTo(px,py)}x.stroke()}},
  move(d){if(this.run)return;const p=this.pool(),i=clamp(p.indexOf(this.sel)+d,0,p.length-1);this.sel=p[i];this.show();snd.tone(hz(this.sel),.6);cam.kick=RM?0:d*7},
  edge(dir){this.move(dir==='E'?1:-1)},
  tap(t){if(t.closest('#dCard')||t.closest('#bird'))snd.tone(hz(this.sel),1.2)},
  holdStart(t,viaKey){if(ear.status==='on')return;if(viaKey||(t&&t.closest('#dCard')))this.holding=true},
  holdEnd(){this.holding=false}
};

const rooms={'0,0':hub,'1,0':nuty,'-1,0':palce,'0,-1':stroj,'0,1':dlugie};
for(const k in rooms){const[x,y]=k.split(',').map(Number);rooms[k].el.style.left=`calc(${x}*(100% + ${GAP}px))`;rooms[k].el.style.top=`calc(${y}*(100% + ${GAP}px))`;rooms[k].rid=k}
let cur=hub;

/* ================= camera + gestures ================= */
const camEl=$('#cam');
let W=1,H=1;
const cam={rx:0,ry:0,px:0,py:0,vx:0,vy:0,tx:0,ty:0,drag:false,travel:false,kick:RM?0:34,lt:'',lm:'',lc:'',ll:''};
const lag={x:0,y:0,vx:0,vy:0,sx:0,sy:0};   // loose things on the wall trail behind it and wobble when it stops
const ptr={x:0,y:0,tx:0,ty:0,l:'',last:-1e9};let beat=0,beatL='';
// perch positions come from layout offsets, so camera zoom, intro animations and follow-through never skew them
function perches(){for(const k in rooms){const r=rooms[k],p=r.el.querySelector('.perch');if(!p)continue;
  if(r===hub){const a=hub.ty.getBoundingClientRect(),b=r.el.getBoundingClientRect();r.perchPos={x:a.left-b.left+a.width/2,y:a.bottom-b.top-a.height*.05};continue}let x=p.offsetLeft,y=p.offsetTop;const o=p.offsetParent;
  if(o&&o!==r.el){x+=o.offsetLeft;y+=o.offsetTop}
  r.perchPos={x,y}}}
function measure(){W=stage.clientWidth;H=stage.clientHeight;cam.tx=cam.px=cam.rx*(W+GAP);cam.ty=cam.py=cam.ry*(H+GAP);cam.vx=cam.vy=0;
  perches();fx.size();bird.place(true);if(cur===dlugie)dlugie.size();nuty.lift()}
function land(){perches();const t=bird.goal();if(t){if(bird.fl){bird.fl.x1=t.x;bird.fl.y1=t.y}else if(!cam.drag){bird.x=t.x;bird.y=t.y}}
  snd.land(cur.rid);if(!RM){lag.vy+=230;cam.kick=6}cur.landed&&cur.landed();vis(0)}
function stepCam(dt){
  if(cam.drag){const d=Math.exp(-dt*9);cam.vx*=d;cam.vy*=d}
  else{
    if(RM){cam.px=cam.tx;cam.py=cam.ty;cam.vx=cam.vy=0}
    else{const k=180,c=21;
      cam.vx+=(-k*(cam.px-cam.tx)-c*cam.vx)*dt;cam.vy+=(-k*(cam.py-cam.ty)-c*cam.vy)*dt;cam.px+=cam.vx*dt;cam.py+=cam.vy*dt;
      if(Math.abs(cam.px-cam.tx)<.5&&Math.abs(cam.vx)<10){cam.px=cam.tx;cam.vx=0}
      if(Math.abs(cam.py-cam.ty)<.5&&Math.abs(cam.vy)<10){cam.py=cam.ty;cam.vy=0}}
    if(cam.travel&&cam.px===cam.tx&&cam.py===cam.ty){cam.travel=false;land()}
    else if(cam.shown&&!cam.travel&&cam.px===cam.tx&&cam.py===cam.ty)vis(0);
  }
  cam.kick*=Math.exp(-dt*5.5);if(Math.abs(cam.kick)<.05)cam.kick=0;
  const t=`translate3d(${(-cam.px).toFixed(1)}px,${(-cam.py).toFixed(1)}px,0)`;if(t!==cam.lt){cam.lt=t;wall.style.transform=t}
  // the camera pulls back and swings in perspective while it travels: one transform, nothing repaints
  const far=clamp(Math.hypot((cam.px-cam.tx)/(W+GAP),(cam.py-cam.ty)/(H+GAP)),0,1);
  const cs=RM?'none':`scale(${(1-.08*Math.sin(Math.PI*far)).toFixed(4)}) rotateY(${clamp(cam.vx*.005,-11,11).toFixed(2)}deg) rotateX(${clamp(-cam.vy*.005,-10,10).toFixed(2)}deg)`;
  if(cs!==cam.lc){cam.lc=cs;camEl.style.transform=cs}
  // style writes below touch only the poster in view, and only while something actually changes
  const mx=(2.2+cam.kick).toFixed(1),my=(1.4-cam.kick*.55).toFixed(1),m=mx+'|'+my;
  if(m!==cam.lm){cam.lm=m;cur.el.style.setProperty('--mx',mx);cur.el.style.setProperty('--my',my)}
  if(!RM){
    lag.sx+=(cam.vx-lag.sx)*Math.min(1,dt*14);lag.sy+=(cam.vy-lag.sy)*Math.min(1,dt*14);
    lag.vx+=(170*(lag.sx*.008-lag.x)-12*lag.vx)*dt;lag.vy+=(170*(lag.sy*.008-lag.y)-12*lag.vy)*dt;
    lag.x=clamp(lag.x+lag.vx*dt,-28,28);lag.y=clamp(lag.y+lag.vy*dt,-28,28);
    const l=lag.x.toFixed(1)+'|'+lag.y.toFixed(1);
    if(l!==cam.ll){cam.ll=l;for(const e of cur.lagEls)e.el.style.translate=`${(lag.x*e.k).toFixed(1)}px ${(lag.y*e.k).toFixed(1)}px`}
    if(cur===hub){ptr.x+=(ptr.tx-ptr.x)*Math.min(1,dt*5);ptr.y+=(ptr.ty-ptr.y)*Math.min(1,dt*5);
      const pp=ptr.x.toFixed(2)+'|'+ptr.y.toFixed(2);if(pp!==ptr.l){ptr.l=pp;hub.scene.style.setProperty('--ptx',ptr.x.toFixed(2));hub.scene.style.setProperty('--pty',ptr.y.toFixed(2))}}
  }
  snd.slide(cam.drag||cam.travel?Math.hypot(cam.vx,cam.vy):0);
}
const DIRS={E:[1,0],W:[-1,0],S:[0,1],N:[0,-1]};
function vis(m,old){cam.shown=!!m;const[cx,cy]=cur.rid.split(',').map(Number);
  for(const k in rooms){const r=rooms[k],[x,y]=k.split(',').map(Number);
    r.el.classList.toggle('on',r===cur||(!!m&&r===old));r.el.classList.toggle('live',r===cur)}}
const neighbour=d=>rooms[(cam.rx+DIRS[d][0])+','+(cam.ry+DIRS[d][1])];
const hasEdge=d=>cur.edges&&cur.edges.includes(d)&&(!cur.edges_ok||cur.edges_ok(d));
let wake=null;
function goTo(x,y){const r=rooms[x+','+y];if(!r||r===cur)return;
  const fwd=x>cam.rx||y>cam.ry;
  const old=cur;cur.leave&&cur.leave();for(const v of['--mx','--my','--beat'])old.el.style.removeProperty(v);for(const e of old.lagEls)e.el.style.translate='';cam.lm=cam.ll=beatL='';cam.rx=x;cam.ry=y;cam.tx=x*(W+GAP);cam.ty=y*(H+GAP);cam.travel=true;cur=r;vis(1,old);
  for(const k in rooms)rooms[k].el.inert=rooms[k]!==cur;
  document.querySelectorAll('#map rect').forEach(e=>e.classList.toggle('at',e.dataset.k===r.rid));stage.dataset.room=r.rid;pop($('#map'));
  bird.liftT=0;bird.puff(0);bird.sayEl.classList.remove('on');
  cur.enter&&cur.enter();bird.place();snd.ensure();snd.peel(fwd);
  if(cur.listens&&ear.status==='off')ear.start();
  try{if(cur.listens&&navigator.wakeLock&&!wake)navigator.wakeLock.request('screen').then(w=>{wake=w;w.addEventListener('release',()=>wake=null)}).catch(()=>{});
    if(!cur.listens&&wake){wake.release();wake=null}}catch(e){}
}
function bump(d){if(!RM){cam.vx+=DIRS[d][0]*900;cam.vy+=DIRS[d][1]*900}snd.bump();bird.set('hear',400)}
function act(d){const n=neighbour(d);if(n){const[x,y]=n.rid.split(',').map(Number);goTo(x,y)}else if(hasEdge(d)){cur.edge(d)}else bump(d)}
function press(el,fn){el.addEventListener('pointerdown',e=>{e.stopPropagation();snd.ensure();bird.wake();fn(e)});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();fn(e)}})}

let g=null;
stage.addEventListener('pointerdown',e=>{
  if(g||e.button>0||e.target.closest('[data-nodrag]'))return;
  snd.ensure();bird.wake();
  g={id:e.pointerId,x0:e.clientX,y0:e.clientY,t0:performance.now(),axis:null,dir:null,target:e.target,lx:e.clientX,ly:e.clientY,lt:performance.now(),v:0,held:true};
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
  cur.holdStart&&cur.holdStart(e.target,false);
});
stage.addEventListener('pointermove',e=>{
  const sb=stage.getBoundingClientRect();ptr.last=performance.now();ptr.tx=((e.clientX-sb.left)/W-.5)*2;ptr.ty=((e.clientY-sb.top)/H-.5)*2;bird.ptr={x:e.clientX-sb.left,y:e.clientY-sb.top};
  if(!g||e.pointerId!==g.id)return;
  const dx=e.clientX-g.x0,dy=e.clientY-g.y0;
  if(!g.axis){if(Math.hypot(dx,dy)<10)return;g.axis=Math.abs(dx)>Math.abs(dy)?'x':'y';stage.classList.add('dragging');if(g.held){g.held=false;cur.holdEnd&&cur.holdEnd()}}
  const d=g.axis==='x'?dx:dy,dim=g.axis==='x'?W:H,dir=g.axis==='x'?(d<0?'E':'W'):(d<0?'S':'N');
  if(g.dir&&g.dir!==dir&&cur.edgeDrag)cur.edgeDrag(g.dir,0);if(g.dir!==dir)vis(1,neighbour(dir));g.dir=dir;
  const now=performance.now(),p=g.axis==='x'?e.clientX:e.clientY,lp=g.axis==='x'?g.lx:g.ly;
  if(now>g.lt){g.v=g.v*.5+((p-lp)/(now-g.lt))*.5}g.lx=e.clientX;g.ly=e.clientY;g.lt=now;
  let off;
  if(neighbour(dir))off=d;
  else if(hasEdge(dir)){cur.edgeDrag&&cur.edgeDrag(dir,Math.min(1,Math.abs(d)/(dim*.28)));off=d*.06}
  else off=d*.2;
  cam.drag=true;
  if(g.axis==='x'){const np=cam.rx*(W+GAP)-off;cam.vx=clamp((np-cam.px)*60,-2600,2600);cam.px=np;cam.py=cam.ry*(H+GAP)}
  else{const np=cam.ry*(H+GAP)-off;cam.vy=clamp((np-cam.py)*60,-2600,2600);cam.py=np;cam.px=cam.rx*(W+GAP)}
});
function endGesture(e,cancel){
  if(!g||e.pointerId!==g.id)return;const s=g;g=null;cam.drag=false;stage.classList.remove('dragging');
  if(s.held){cur.holdEnd&&cur.holdEnd()}
  if(!s.axis){ if(cancel)return;
    if(performance.now()-s.t0<450){const go=s.target.closest('[data-go]'),a=s.target.closest('[data-act]');
      if(go){const[x,y]=go.dataset.go.split(',').map(Number);goTo(x,y)}else if(a){act(a.dataset.act)}else cur.tap&&cur.tap(s.target)}
    return}
  const d=s.axis==='x'?e.clientX-s.x0:e.clientY-s.y0,dim=s.axis==='x'?W:H,dir=s.dir;
  const flick=Math.abs(s.v)>.4&&Math.abs(d)>26&&Math.sign(s.v)===Math.sign(d);
  if(neighbour(dir)){if(!cancel&&(Math.abs(d)>dim*.2||flick))act(dir)}
  else if(hasEdge(dir)){cur.edgeDrag&&cur.edgeDrag(dir,0);if(!cancel&&(Math.abs(d)>dim*.11||flick))cur.edge(dir)}
  else if(Math.abs(d)>60){snd.bump()}
}
stage.addEventListener('pointerup',e=>endGesture(e,false));
stage.addEventListener('pointercancel',e=>endGesture(e,true));
let wacc=0,wlock=0;
stage.addEventListener('wheel',e=>{e.preventDefault();const now=performance.now();if(now<wlock)return;
  const ax=Math.abs(e.deltaX)>Math.abs(e.deltaY)?'x':'y',d=ax==='x'?e.deltaX:e.deltaY;wacc+=d;
  if(Math.abs(wacc)>70){act(ax==='x'?(wacc>0?'E':'W'):(wacc>0?'S':'N'));wacc=0;wlock=now+650}},{passive:false});
let spaceDown=false;
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;snd.ensure();bird.wake();
  const k={ArrowRight:'E',ArrowLeft:'W',ArrowDown:'S',ArrowUp:'N'}[e.key];
  if(k){e.preventDefault();if(!e.repeat)act(k);return}
  const f=document.activeElement;
  if((e.key==='Enter'||e.key===' ')&&f&&f.matches&&f.matches('[data-go],[data-act]')){e.preventDefault();
    if(f.dataset.go){const[x,y]=f.dataset.go.split(',').map(Number);goTo(x,y)}else act(f.dataset.act);return}
  if(e.key===' '){e.preventDefault();if(!spaceDown){spaceDown=true;cur.holdStart&&cur.holdStart(cur.el.querySelector('.card'),true)}return}
  if(e.key==='h'||e.key==='H'){if(cur===nuty)nuty.edge('S');return}
  cur.onKey&&cur.onKey(e.key);
});
addEventListener('keyup',e=>{if(e.key===' '&&spaceDown){spaceDown=false;cur.holdEnd&&cur.holdEnd()}});
addEventListener('resize',measure);
stage.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= boot ================= */
for(const k in rooms){const r=rooms[k];r.init&&r.init();r.el.inert=r!==hub;r.lagEls=[...r.el.querySelectorAll('[data-lag]')].map(el=>({el,k:parseFloat(el.style.getPropertyValue('--k'))||1}))}
{const C={'0,0':['pink','blue','yellow'],'1,0':['yellow','blue','white'],'-1,0':['pink','blue'],'0,-1':['yellow','pink','white'],'0,1':['pink','yellow','blue']};   // drifting paper scraps behind everything
  for(const k in rooms)for(let i=0;i<4;i++){const e=document.createElement('i'),r=Math.random;e.className='fl s'+(i%4);
    e.style.cssText=`--s:${14+r()*30|0}px;--x:${r()*92|0}%;--y:${6+r()*84|0}%;--c:var(--${C[k][i%C[k].length]});--d:${5+r()*7}s;--dl:-${r()*8}s;--tx:${(r()-.5)*90|0}px;--ty:${(r()-.5)*110|0}px;--r:${(r()-.5)*260|0}deg`;
    rooms[k].el.prepend(e)}}
document.querySelector('#map rect[data-k="0,0"]').classList.add('at');stage.dataset.room='0,0';
vis(0);measure();hub.enter();
let intro=!RM;
if(intro){hub.home(false);bird.x=-110;bird.y=H*.2;bird.face=1;   // the pigeon flies in once the poster is up
  setTimeout(()=>{intro=false;bird.place()},900);setTimeout(()=>stage.classList.remove('boot'),2400)}
else stage.classList.remove('boot');
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{perches();const t=bird.goal();if(bird.fl){bird.fl.x1=t.x;bird.fl.y1=t.y}else if(!intro)bird.place(true)});
let last=performance.now();
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  stepCam(dt);
  const f=cur.listens?ear.read(now):null;
  cur.frame&&cur.frame(f,now,dt);
  if(!RM&&cur.listens){const lv=f&&f.voiced?Math.min(1,f.level*7):0;beat+=(lv-beat)*Math.min(1,dt*(lv>beat?18:5));   // the backdrop swells with the sound
    const b=(Math.round(beat*20)/20).toFixed(2);if(b!==beatL){beatL=b;cur.el.style.setProperty('--beat',b)}}
  bird.frame(now,dt);
  fx.frame(dt);
  requestAnimationFrame(tick)}
requestAnimationFrame(tick);
})();
</script>
